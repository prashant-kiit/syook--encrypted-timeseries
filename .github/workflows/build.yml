name: CICD Pipeline for Syook Encryption Application

on:
  pull_request:
    branches: ["master"]
    types: [closed]

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - emitter-service
          - listener-service
          - dashboard-backend
          - dashboard-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.event.pull_request.merge_commit_sha }} \
            ./${{ matrix.service }}

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.event.pull_request.merge_commit_sha }}
