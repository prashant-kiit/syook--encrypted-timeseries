services:

  emitter-service:
    image: emitter-service:latest
    container_name: emitter-service
    build:
      context: ./emitter-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - encryption-app-network

  listener-service:
    image: listener-service:latest
    container_name: listener-service
    build:
      context: ./listener-service
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    networks:
      - encryption-app-network

  redis:
    image: redis:latest
    container_name: redis-service
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - encryption-app-network

  mongodb:
    image: mongo:7
    container_name: mongodb-service
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: listener_db
    volumes:
      - mongo_data:/data/db
    networks:
      - encryption-app-network

networks:
  encryption-app-network:
    driver: bridge

volumes:
  redis_data:
  mongo_data: